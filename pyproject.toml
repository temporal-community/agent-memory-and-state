[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-ai-agent-memory-state-stripe"
version = "0.1.0"
description = "A Temporal refund agent demo of agent memory and execution state"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.120,<1",
  "openai>=2.0,<3",
  "stripe>=14,<15",
  "temporalio>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "rich>=13,<15",
  "ruff>=0.12,<1",
]
tui = [
  "rich>=13,<15",
]

[project.scripts]
refund-demo = "refund_agent.cli:main"
refund-worker = "refund_agent.worker:main"
permission-chat = "refund_agent.permission_chat:main"
naive-refund = "refund_agent.naive_refund:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
