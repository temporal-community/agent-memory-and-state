[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-and-state"
version = "0.1.0"
description = "A small Temporal refund agent demo for durable execution talks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "stripe>=14,<15",
  "temporalio>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]
tui = [
  "rich>=13,<15",
]

[project.scripts]
refund-demo = "refund_agent.cli:main"
refund-worker = "refund_agent.worker:main"
permission-chat = "refund_agent.permission_chat:main"
naive-refund = "refund_agent.naive_refund:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

