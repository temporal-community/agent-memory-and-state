name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # The test that runs a real local dev server needs the temporal CLI on
      # PATH. Without it, that test skips.
      - name: Install the Temporal CLI
        run: |
          curl -sSfL https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Install the project
        run: uv sync --frozen --extra dev --extra tui

      - name: Lint
        run: make lint

      - name: Type-check
        run: make typecheck

      # Offline: no API keys or secrets. The model and Stripe calls are faked.
      - name: Test
        run: make test
